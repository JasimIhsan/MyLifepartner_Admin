services:
   backend:
      build:
         context: .
         target: builder
      container_name: backend
      restart: always
      environment:
         NODE_OPTIONS: "--dns-result-order=ipv4first"
      volumes:
         - .:/app
         - /app/node_modules
      command: npm run dev
      ports:
         - "3000:3000"
      env_file:
         - .env
      depends_on:
         - postgres
         - redis
      networks:
         - app-network

   postgres:
      image: postgres:15-alpine
      restart: always
      environment:
         - POSTGRES_USER=postgres
         - POSTGRES_PASSWORD=postgres
         - POSTGRES_DB=mylifepartner
      ports:
         - "5433:5432"
      volumes:
         - postgres-data:/var/lib/postgresql/data
      networks:
         - app-network

   redis:
      image: redis:alpine
      restart: always
      ports:
         - "6379:6379"
      volumes:
         - redis-data:/data
      networks:
         - app-network

networks:
   app-network:
      driver: bridge

volumes:
   postgres-data:
   redis-data:
