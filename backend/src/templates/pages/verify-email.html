<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Life Partner Again</title>
    <meta name="apple-itunes-app" content="app-id=YOUR_APP_ID, app-argument={{APP_SCHEME_URL}}">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #FDF5F2;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #4E342E;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #B88973; }
        p { color: #757575; line-height: 1.6; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            background-color: #B88973;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin: 5px;
        }
        .btn:hover { background-color: #a07764; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #B88973;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        window.onload = function() {
            const isAndroid = /android/i.test(navigator.userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const appSchemeUrl = "{{APP_SCHEME_URL}}";
            const androidIntentUrl = "{{ANDROID_INTENT_URL}}";
            if (isAndroid) {
                window.location.href = androidIntentUrl;
            } else {
                window.location.href = appSchemeUrl;
                if (isIOS) {
                    setTimeout(function() { window.location.replace(appSchemeUrl); }, 500);
                }
            }
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('fallback').style.display = 'block';
            }, 3000);
        };
    </script>
</head>
<body>
    <div class="container">
        <div id="loader" class="loader"></div>
        <h2>Verifying your email...</h2>
        <p>You are being redirected to the Life Partner Again app.</p>
        <div id="fallback" style="display: none;">
            <p>If you are not redirected automatically, please click a button below to open the app manually:</p>
            <a href="{{ANDROID_INTENT_URL}}" class="btn" id="android-btn" style="display:none;">Open App (Android)</a>
            <a href="{{APP_SCHEME_URL}}" class="btn" id="ios-btn" style="display:none;">Open App (iOS/Web)</a>
            <script>
                if (/android/i.test(navigator.userAgent)) {
                    document.getElementById('android-btn').style.display = 'inline-block';
                } else {
                    document.getElementById('ios-btn').style.display = 'inline-block';
                }
            </script>
        </div>
    </div>
</body>
</html>
