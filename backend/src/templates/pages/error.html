<!DOCTYPE html>
<html>
<head>
    <title>{{TITLE}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fdf5f2;
            margin: 0;
            padding: 20px;
            color: #4e342e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            box-sizing: border-box;
            text-align: center;
        }
        .header {
            margin-bottom: 20px;
        }
        .header h2 {
            color: #b88973;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #757575;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            background-color: #b88973;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .btn:hover {
            background-color: #a07460;
        }
        .btn-secondary {
            background-color: #ffffff;
            color: #b88973;
            border: 1px solid #b88973;
        }
        .btn-secondary:hover {
            background-color: #fdf5f2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{{TITLE}}</h2>
        </div>
        <p>{{MESSAGE}}</p>
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">Go Back</button>
    </div>
</body>
</html>
