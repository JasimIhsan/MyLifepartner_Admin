<!DOCTYPE html>
<html>
<head>
    <title>Password Reset Successful</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fdf5f2;
            margin: 0;
            padding: 20px;
            color: #4e342e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            box-sizing: border-box;
            text-align: center;
        }
        .header {
            margin-bottom: 20px;
        }
        .header h2 {
            color: #b88973;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content p {
            font-size: 16px;
            line-height: 1.6;
            color: #757575;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #b88973;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #a07460;
        }
        .icon {
            font-size: 48px;
            color: #4caf50;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✓</div>
        <div class="header">
            <h2>Password Reset Successful</h2>
        </div>
        <div class="content">
            <p>Your password has been reset successfully.</p>
            <p>You can now close this window and log in to the Life Partner Again app with your new password.</p>
        </div>
    </div>
</body>
</html>
