<!doctype html>
<html>
   <head>
      <title>Reset Password</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <style>
         body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #fdf5f2;
            margin: 0;
            padding: 20px;
            color: #4e342e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
         }
         .container {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            box-sizing: border-box;
            text-align: center;
         }
         .header {
            margin-bottom: 30px;
         }
         .header h2 {
            color: #b88973;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
         }
         .form-group {
            margin-bottom: 20px;
            text-align: left;
         }
         .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #757575;
         }
         .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
         }
         .form-group input:focus {
            border-color: #b88973;
         }
         .btn {
            display: block;
            width: 100%;
            background-color: #b88973;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            margin-bottom: 15px;
         }
         .btn:hover {
            background-color: #a07460;
         }
         .btn-secondary {
            background-color: #ffffff;
            color: #b88973;
            border: 1px solid #b88973;
         }
         .btn-secondary:hover {
            background-color: #fdf5f2;
         }
      </style>
   </head>
   <body>
      <div class="container">
         <div class="header">
            <h2>Reset Your Password</h2>
         </div>
         <form action="/api/user/auth/forgot-password/reset" method="POST">
            <input type="hidden" name="token" value="{{TOKEN}}" />
            <div class="form-group">
               <label>New Password</label>
               <input type="password" name="password" required placeholder="Enter new password" />
            </div>
            <div class="form-group">
               <label>Confirm Password</label>
               <input type="password" name="confirmPassword" required placeholder="Confirm new password" />
            </div>
            <button type="submit" class="btn">Reset Password</button>
         </form>
      </div>
   </body>
</html>
