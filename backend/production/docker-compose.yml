services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lifepartner-backend
    restart: unless-stopped
    ports:
      - "3015:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
